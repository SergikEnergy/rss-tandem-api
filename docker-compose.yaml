version: "3.8"

services:
    postgres_db:
        image: postgres:16-alpine

        container_name: postgres_db

        restart: unless-stopped

        env_file:
            - .env.dev

        ports:
            - ${DB_PORT}:${DB_PORT}

        volumes:
            - postgres_data:/data/db

        networks:
            - nestjs-network

        healthcheck:
            test: ["CMD", "pg_isready", "-U", "postgres"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    postgres_data:

networks:
    nestjs-network:
        driver: bridge
        name: nestjs-network
